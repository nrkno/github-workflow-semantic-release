---
on:
  workflow_call:
    inputs:
      release-enabled:
        type: boolean
        default: true
      lint-enabled:
        type: boolean
        default: true
      runs-on:
        type: string
        default: ubuntu-latest
    outputs:
      released:
        description: "'true' when a new release was published, 'false' otherwise."
        value: ${{ jobs.release.outputs.released }}
      version:
        description: "The new release's semantic version, e.g. '1.8.3'."
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: "The new release's git tag, e.g. 'v1.8.3'."
        value: ${{ jobs.release.outputs.tag }}
      major:
        description: "Major version component, e.g. '1'."
        value: ${{ jobs.release.outputs.major }}
      minor:
        description: "Minor version component, e.g. '8'."
        value: ${{ jobs.release.outputs.minor }}
      patch:
        description: "Patch version component, e.g. '3'."
        value: ${{ jobs.release.outputs.patch }}

name: Commit lint and semantic release

# Jobs declare their own least-privilege permissions.
permissions: {}

jobs:
  commitlint:
    name: Commit lint
    runs-on: ${{ inputs.runs-on }}
    if: inputs.lint-enabled
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint commits
        # NOTE (known limitation): on pull_request events, semrel lint resolves
        # the commit range as latestAnnotatedTag→HEAD rather than baseRef→HEAD.
        # Ensure all commits since the last release tag conform to conventional
        # commit format before opening a PR.
        # TODO(bump): update this SHA together with the release and
        # notify.yml pins once nrkno/github-action-semantic-release publishes
        # the security-sweep release (currently the latest released, v0.14.5).
        uses: nrkno/github-action-semantic-release@5afff0e9b820879b997a3e381d09d1dc3941dc00 # v0.14.5
        with:
          subcommand: lint
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    runs-on: ${{ inputs.runs-on }}
    # pull_request_target runs with github.ref of the base branch; never release from it.
    if: >-
      inputs.release-enabled
      && github.event_name != 'pull_request_target'
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
      pull-requests: read
    outputs:
      released: ${{ steps.semrel.outputs.released }}
      version: ${{ steps.semrel.outputs.version }}
      tag: ${{ steps.semrel.outputs.tag }}
      major: ${{ steps.semrel.outputs.major }}
      minor: ${{ steps.semrel.outputs.minor }}
      patch: ${{ steps.semrel.outputs.patch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Release
        id: semrel
        # TODO(bump): see the lint step; keep all semrel pins on the same SHA.
        uses: nrkno/github-action-semantic-release@5afff0e9b820879b997a3e381d09d1dc3941dc00 # v0.14.5
        with:
          subcommand: release
          token: ${{ secrets.GITHUB_TOKEN }}
