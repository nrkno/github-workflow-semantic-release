---
name: Notify PRs

on:
  release:
    types: [published]

permissions:
  contents: read
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Notify PRs
        # TODO(bump): keep on the same SHA as workflow.yaml (see TODO there),
        # then run `gh actions-lock`.
        uses: nrkno/github-action-semantic-release@5afff0e9b820879b997a3e381d09d1dc3941dc00 # v0.14.5
        with:
          subcommand: notify
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          SEMREL_TAG: ${{ github.event.release.tag_name }}
          SEMREL_VERSION: ${{ github.event.release.name }}
          SEMREL_RELEASE_URL: ${{ github.event.release.html_url }}
