name: Autodoc

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions: {}

jobs:
  autodoc:
    # Fork PRs must not get a write token.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    permissions:
      contents: write
    uses: nrkno/github-workflow-action-workflow-autodoc/.github/workflows/workflow.yaml@84a54022b61e892fcc09d945795771d2d3822ad7 # v1.1.4
    with:
      runs-on: '"ubuntu-latest"'
      workflow_file: '.github/workflows/workflow.yaml'
      doc_file: 'README.md'
      start_token: '<!-- autodoc start -->'
      end_token: '<!-- autodoc end -->'
      table: 'false'
      debug: '0'
